<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e4ebe3; --body: #f6f8f4; --ink: #1d2a2a; --key: #ffffff; --key-ink: #1d2a2a;
  --op: #4b3f72; --op-ink: #ffffff; --fn: #cfdccf; --eq: #1d2a2a; --eq-ink: #f6f8f4; --muted: #6b7a76;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a1a; --body: #1d2625; --ink: #eef3ee; --key: #2a3534; --key-ink: #eef3ee;
    --op: #9b8bd4; --op-ink: #141a1a; --fn: #3a4846; --eq: #eef3ee; --eq-ink: #1d2625; --muted: #93a39f;
  }
}
:root[data-theme="dark"] {
  --bg: #141a1a; --body: #1d2625; --ink: #eef3ee; --key: #2a3534; --key-ink: #eef3ee;
  --op: #9b8bd4; --op-ink: #141a1a; --fn: #3a4846; --eq: #eef3ee; --eq-ink: #1d2625; --muted: #93a39f;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.calc { width: 100%; max-width: 340px; background: var(--body); border-radius: 24px; padding: 20px; }
.screen { text-align: right; padding: 12px 8px 20px; min-height: 108px; display: flex; flex-direction: column; justify-content: flex-end; }
.history { color: var(--muted); font-size: 15px; min-height: 22px; overflow-x: auto; white-space: nowrap; }
.value { font-size: 44px; font-weight: 500; line-height: 1.15; overflow-x: auto; white-space: nowrap; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
button {
  font: inherit; font-size: 22px; font-weight: 500; border: 0; border-radius: 16px; height: 62px;
  background: var(--key); color: var(--key-ink); cursor: pointer; transition: transform .06s ease;
}
button:active { transform: scale(.95); }
button:focus-visible { outline: 3px solid var(--op); outline-offset: 2px; }
button.fn { background: var(--fn); }
button.op { background: var(--op); color: var(--op-ink); }
button.op.active { outline: 3px solid var(--ink); outline-offset: 2px; }
button.eq { background: var(--eq); color: var(--eq-ink); }
button.wide { grid-column: span 2; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="history" id="history"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="back" aria-label="Delete last digit">⌫</button>
    <button class="fn" data-action="sign" aria-label="Toggle sign">±</button>
    <button class="op" data-op="/" aria-label="Divide">÷</button>

    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*" aria-label="Multiply">×</button>

    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-" aria-label="Subtract">−</button>

    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+" aria-label="Add">+</button>

    <button class="wide" data-num="0">0</button>
    <button data-action="dot">.</button>
    <button class="eq" data-action="equals" aria-label="Equals">=</button>
  </div>
</main>

<script>
(function () {
  var SYM = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  var current = "0";     // string being typed or last result
  var previous = null;   // left operand (number)
  var operator = null;   // pending operator
  var fresh = false;     // next digit starts a new number
  var error = false;

  var valueEl = document.getElementById("value");
  var historyEl = document.getElementById("history");

  function compute(a, b, op) {
    switch (op) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/": return b === 0 ? null : a / b;
    }
  }

  function format(n) {
    // trim floating-point noise (0.1 + 0.2) and keep big/small numbers readable
    var r = parseFloat(n.toPrecision(12));
    return String(r);
  }

  function render() {
    valueEl.textContent = current;
    historyEl.textContent = previous !== null && operator
      ? format(previous) + " " + SYM[operator] + (fresh ? "" : " " + current)
      : "";
    document.querySelectorAll("[data-op]").forEach(function (b) {
      b.classList.toggle("active", b.dataset.op === operator && fresh);
    });
  }

  function showError(msg) {
    current = msg; previous = null; operator = null; fresh = true; error = true;
    render();
  }

  function reset() {
    current = "0"; previous = null; operator = null; fresh = false; error = false;
    render();
  }

  function inputDigit(d) {
    if (error) reset();
    if (fresh) { current = d; fresh = false; }
    else if (current === "0") current = d;
    else if (current.replace(/[-.]/g, "").length < 12) current += d;
    render();
  }

  function inputDot() {
    if (error) reset();
    if (fresh) { current = "0."; fresh = false; }
    else if (current.indexOf(".") === -1) current += ".";
    render();
  }

  function toggleSign() {
    if (error || current === "0") return;
    current = current.charAt(0) === "-" ? current.slice(1) : "-" + current;
    render();
  }

  function backspace() {
    if (error) return reset();
    if (fresh) return;
    current = current.length > 1 && current !== "-0" ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
    render();
  }

  function chooseOperator(op) {
    if (error) return;
    var num = parseFloat(current);
    if (operator && !fresh) {
      // chain: 2 + 3 + ... computes 2 + 3 first
      var result = compute(previous, num, operator);
      if (result === null) return showError("Can't divide by 0");
      previous = result;
      current = format(result);
    } else if (!operator) {
      previous = num;
    }
    operator = op;
    fresh = true;
    render();
  }

  function equals() {
    if (error || !operator || previous === null) return;
    var num = parseFloat(current);
    var result = compute(previous, num, operator);
    if (result === null) return showError("Can't divide by 0");
    historyEl.textContent = format(previous) + " " + SYM[operator] + " " + format(num) + " =";
    current = format(result);
    previous = null; operator = null; fresh = true;
    valueEl.textContent = current;
    document.querySelectorAll("[data-op]").forEach(function (b) { b.classList.remove("active"); });
  }

  document.getElementById("keys").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.num !== undefined) inputDigit(b.dataset.num);
    else if (b.dataset.op) chooseOperator(b.dataset.op);
    else switch (b.dataset.action) {
      case "dot": inputDot(); break;
      case "equals": equals(); break;
      case "clear": reset(); break;
      case "back": backspace(); break;
      case "sign": toggleSign(); break;
    }
  });

  // Keyboard support
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (/^[0-9]$/.test(k)) inputDigit(k);
    else if (k === ".") inputDot();
    else if ("+-*/".indexOf(k) !== -1) { e.preventDefault(); chooseOperator(k); }
    else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
    else if (k === "Backspace") backspace();
    else if (k === "Escape" || k === "Delete") reset();
  });

  render();
})();
</script>
</body>
</html>
